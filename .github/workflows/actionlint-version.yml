name: Track actionlint version

on:
  schedule:
    - cron: "30 0 * * 3"
  push:
    branches:
      - main
    paths:
      - ".github/actionlint-version"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: actionlint-version-tracker
  cancel-in-progress: true

jobs:
  check-version:
    name: Check latest release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Compare pinned and latest versions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          issue_title="ci: update actionlint"
          configured_version="$(< .github/actionlint-version)"
          latest_tag="$(gh api repos/rhysd/actionlint/releases/latest --jq .tag_name)"
          latest_version="${latest_tag#v}"
          version_pattern='^[0-9]+\.[0-9]+\.[0-9]+$'

          if [[ ! "$configured_version" =~ $version_pattern ]]; then
            echo "Invalid configured actionlint version: $configured_version" >&2
            exit 1
          fi
          if [[ ! "$latest_version" =~ $version_pattern ]]; then
            echo "Invalid latest actionlint version: $latest_version" >&2
            exit 1
          fi

          issue_number="$(
            gh issue list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --search '"ci: update actionlint" in:title' \
              --json number,title \
              --jq 'map(select(.title == "ci: update actionlint")) | .[0].number // empty'
          )"

          if [[ "$configured_version" == "$latest_version" ]]; then
            if [[ -n "$issue_number" ]]; then
              gh issue close "$issue_number" \
                --repo "$GITHUB_REPOSITORY" \
                --comment "Resolved: actionlint ${configured_version} is the latest release."
            fi
            echo "actionlint ${configured_version} is current."
            exit 0
          fi

          printf -v issue_body \
            'CI pins an older actionlint release.\n\n- Configured: %s\n- Latest: %s\n\nUpdate .github/actionlint-version, then verify the release artifact attestation and CI checks.' \
            "$configured_version" \
            "$latest_version"

          if [[ -n "$issue_number" ]]; then
            gh issue edit "$issue_number" \
              --repo "$GITHUB_REPOSITORY" \
              --body "$issue_body"
          else
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$issue_title" \
              --body "$issue_body"
          fi

          echo "actionlint ${configured_version} is outdated; latest is ${latest_version}." >&2
          exit 1
