name: Track actionlint version

on:
  schedule:
    - cron: "30 0 * * 3"
  push:
    branches:
      - main
    paths:
      - ".github/actionlint-version"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: actionlint-version-tracker
  cancel-in-progress: true

jobs:
  check-version:
    name: Check latest release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare pinned and latest versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/track-actionlint-version.sh
