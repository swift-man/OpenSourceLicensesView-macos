name: Track actionlint version

on:
  schedule:
    - cron: "30 0 * * 3"
  push:
    branches:
      - main
    paths:
      - ".github/actionlint-version"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: actionlint-version-tracker
  cancel-in-progress: true

jobs:
  check-version:
    name: Check latest release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Compare pinned and latest versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/track-actionlint-version.sh
