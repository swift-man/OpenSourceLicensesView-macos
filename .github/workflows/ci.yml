name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  minimum-supported:
    name: Swift 5.9.2 / Ubuntu 22.04
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Swift 5.9.2
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
        with:
          swift-version: "5.9.2"

      - name: Verify Swift 5.9 toolchain
        shell: bash
        run: |
          set -euo pipefail
          swift_version="$(swift --version)"
          printf '%s\n' "$swift_version"
          grep -Eq 'Swift version 5\.9([.[:space:]]|$)' <<< "$swift_version"

      - name: Build package
        run: swift build

      - name: Run tests
        run: swift test

  macos:
    name: Current Swift / macOS 15
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Show Swift version
        run: swift --version

      - name: Build package
        run: swift build

      - name: Run tests
        run: swift test
