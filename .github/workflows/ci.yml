name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  minimum-supported:
    name: Swift 6.0 / macOS 15
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.0.app/Contents/Developer
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify Swift 6.0 toolchain
        shell: bash
        run: |
          set -euo pipefail
          swift_version="$(swift --version)"
          printf '%s\n' "$swift_version"
          grep -Eq 'Apple Swift version 6\.0([.[:space:]]|$)' <<< "$swift_version"

      - name: Build package
        run: swift build

      - name: Run tests
        run: swift test

  macos:
    name: Current Swift / macOS 15
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Show Swift version
        run: swift --version

      - name: Build package
        run: swift build

      - name: Run tests
        run: swift test
